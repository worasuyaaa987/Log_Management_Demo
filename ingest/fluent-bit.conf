[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ---------------------------------------------------
# INPUTS
# ---------------------------------------------------

[INPUT]
    Name         syslog
    Mode         tcp
    Listen       0.0.0.0
    Port         514
    Parser       syslog-rfc3164
    Tag          syslog.tcp

[INPUT]
    Name         syslog
    Mode         udp
    Listen       0.0.0.0
    Port         514
    Parser       syslog-rfc3164
    Tag          syslog.udp

[INPUT]
    Name         tail
    Path         /fluent-bit/etc/logs/*.log
    Parser       syslog-rfc3164
    Tag          syslog.batch
    Read_from_Head    true
    Refresh_Interval  5

# ---------------------------------------------------
# FILTERS
# ---------------------------------------------------

# 1. Extract Key-Value pairs from the Syslog message
[FILTER]
    Name         parser
    Match        syslog.*
    Key_Name     message
    Parser       kv_parser
    Reserve_Data True

# 2. Normalize fields to the common schema
[FILTER]
    Name         modify
    Match        syslog.*
    
    # Add default static fields for syslog data
    Add          source network
    # Default tenant, in a real setup this might be dynamically routed or set per input port
    Add          tenant demoA
    
    # Rename common shorthand fields from network logs to the common schema
    Rename       src src_ip
    Rename       dst dst_ip
    Rename       spt src_port
    Rename       dpt dst_port
    Rename       proto protocol
    Rename       msg raw
    Rename       event event_type

    # Map remaining fields to standard names if present
    Rename       mac _tags_mac
    Rename       if _tags_interface
    Rename       reason event_subtype

# 3. Add timestamp in RFC3339 format for OpenSearch/FastAPI
[FILTER]
    Name         lua
    Match        syslog.*
    call         add_timestamp
    code         function add_timestamp(tag, timestamp, record) record["@timestamp"] = os.date("!%Y-%m-%dT%H:%M:%SZ", timestamp) return 1, timestamp, record end

# ---------------------------------------------------
# OUTPUTS
# ---------------------------------------------------

# Forward normalized logs to the FastAPI backend
[OUTPUT]
    Name         http
    Match        syslog.*
    Host         backend
    Port         8000
    URI          /ingest
    Format       json
    # Ensure the authorization header uses an environment variable or static token
    Header       Authorization Bearer ${INGEST_TOKEN}

# Debug output (print to stdout for troubleshooting)
[OUTPUT]
    Name         stdout
    Match        syslog.*
